# Horizontal Pod Autoscaler: scale worker deployment based on CPU utilization.
# Scaling: min 2 replicas, max 20; scale when average CPU across pods exceeds 70%.
# For queue-length or task-backlog based scaling, use a custom metrics adapter or the
# queue-based scaling job (see SCALING.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-cloud-worker-hpa
  labels:
    app: agent-cloud-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-cloud-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
