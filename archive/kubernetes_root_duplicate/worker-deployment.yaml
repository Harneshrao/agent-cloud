# Worker Deployment: runs agent-cloud workers as Kubernetes pods.
# Workers register with the platform on startup (existing worker registry) and pull tasks
# from the scheduler or Redis queue. Set SCHEDULER_URL and REDIS_URL for your cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-cloud-worker
  labels:
    app: agent-cloud-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-cloud-worker
  template:
    metadata:
      labels:
        app: agent-cloud-worker
    spec:
      containers:
        - name: worker
          image: agent-cloud-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "workers.worker"]
          envFrom:
            - configMapRef:
                name: worker-config
          # Override per-pod or add secrets (e.g. REDIS_URL from Secret)
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            # Worker process is long-running; no HTTP. Use exec or tcpSocket if needed.
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 10
            periodSeconds: 30
---
# Optional: separate ConfigMap for region-specific pools (e.g. worker-eu)
