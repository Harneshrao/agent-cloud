# Single active scheduler recommended: scale replicas to 1 or use leader election.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: agent-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: your-registry/agent-cloud-scheduler:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agent-cloud-config
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
