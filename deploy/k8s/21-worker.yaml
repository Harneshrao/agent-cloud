apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: agent-cloud
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: your-registry/agent-cloud-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agent-cloud-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-cloud-secrets
                  key: DATABASE_URL
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
