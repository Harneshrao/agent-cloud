apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-cloud-scheduler
  namespace: agent-cloud
  labels:
    app.kubernetes.io/name: agent-cloud
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-cloud
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-cloud
        app.kubernetes.io/component: scheduler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: scheduler
          image: ghcr.io/agent-cloud/agent-cloud-scheduler:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agent-cloud-config
            - secretRef:
                name: agent-cloud-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          terminationMessagePolicy: FallbackToLogsOnError
