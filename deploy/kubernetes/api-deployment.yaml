apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-cloud-api
  namespace: agent-cloud
  labels:
    app.kubernetes.io/name: agent-cloud
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-cloud
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-cloud
        app.kubernetes.io/component: api
      annotations:
        # Wire /metrics (e.g. prometheus_fastapi_instrumentator) then set scrape: "true"
        prometheus.io/scrape: "false"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: api
          image: ghcr.io/agent-cloud/agent-cloud-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agent-cloud-config
            - secretRef:
                name: agent-cloud-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # stdout/stderr → cluster logging / Loki / CloudWatch
          terminationMessagePolicy: FallbackToLogsOnError
