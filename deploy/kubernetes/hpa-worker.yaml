# Horizontal Pod Autoscaler — CPU-based (no KEDA required).
# Do NOT apply together with KEDA ScaledObject on the same Deployment (one scaler per target).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-cloud-worker-cpu
  namespace: agent-cloud
  labels:
    app.kubernetes.io/name: agent-cloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-cloud-worker
  minReplicas: 1
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30
