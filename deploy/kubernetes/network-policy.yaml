# Example: lock API ingress to NGINX only; allow egress to Postgres/Redis and DNS.
# Customize pod selectors to match your Redis/Postgres Services (often in same or other namespaces).
# Omit this file if your platform does not enforce NetworkPolicy yet.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-cloud-api-netpol
  namespace: agent-cloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS (cluster DNS)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres / Redis — replace with CIDRs or namespace selectors for managed endpoints
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    # HTTPS for external deps (optional)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
