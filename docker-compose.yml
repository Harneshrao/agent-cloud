# Local development stack: Postgres, Redis, API (uvicorn), workers, scheduler.
# Postgres is published on host port 5433 by default (avoids conflict with local PostgreSQL on 5432).
# Override: POSTGRES_PORT=5432 docker compose up
#
# Optional dashboard: docker compose --profile dashboard up
#
# Usage:
#   docker compose up --build
#   docker compose --profile dashboard up --build
#
# Scale workers:
#   docker compose up --build --scale worker=3

version: "3.9"

networks:
  default:
    name: agent-cloud

volumes:
  pgdata:
  redisdata:

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent_cloud}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/${POSTGRES_DB:-agent_cloud}
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      ALLOW_ANONYMOUS_DEV: ${ALLOW_ANONYMOUS_DEV:-1}
      DISABLE_RELOAD: "1"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Set SKIP_DB_MIGRATE=1 only for smoke tests without migrations
      SKIP_DB_MIGRATE: ${SKIP_DB_MIGRATE:-0}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/${POSTGRES_DB:-agent_cloud}
      REDIS_URL: redis://redis:6379/0
      WORKER_ID: ${WORKER_ID:-worker-compose}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/${POSTGRES_DB:-agent_cloud}
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_TICK_SEC: ${SCHEDULER_TICK_SEC:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    profiles: ["dashboard"]
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      HOST: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: "development"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_UPSTREAM: http://api:8000
      WATCHPACK_POLLING: "true"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const r=require('http').get('http://0.0.0.0:3000',(x)=>process.exit(x.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)});",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
